name: Admin UI and security regression
on:
  pull_request:
    paths:
      - 'frontend/admin.html'
      - 'backend/wwwroot/admin.html'
      - 'ui-tests/**'
      - '.github/workflows/admin-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
        working-directory: ui-tests
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: ui-tests
      - run: node security-tests/xss-regression-tests.cjs
      - run: dotnet test security-tests/FactoryQuoteApi.SecurityTests.csproj -c Release
      - name: Before screenshots (base branch)
        run: npm test
        working-directory: ui-tests
        env:
          PHASE: before
          BASELINE_REF: origin/main
      - name: Responsive and functional browser matrix
        run: npm test
        working-directory: ui-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: admin-responsive-browser-evidence
          path: ui-tests/artifacts/
          retention-days: 30
