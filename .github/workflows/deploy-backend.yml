name: Deploy Backend to MonsterASP.NET

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/FactoryQuoteApi.csproj

      - name: Build Release
        run: dotnet build backend/FactoryQuoteApi.csproj -c Release --no-restore

      - name: Run Tests (if exists)
        run: |
          if ls tests/*.csproj 1> /dev/null 2>&1; then
            dotnet test --no-build -c Release
          else
            echo "No test projects found, skipping tests."
          fi

      - name: Publish Backend
        run: dotnet publish backend/FactoryQuoteApi.csproj -c Release -o ./backend/publish

      - name: Deploy to MonsterASP.NET via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/publish/
          server-dir: /wwwroot/
          dangerous-clean-slate: false

      - name: Verify Production Health
        run: |
          sleep 10
          curl -f -s -S https://factory-quote.runasp.net/api/health
