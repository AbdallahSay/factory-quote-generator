name: Deploy Backend to MonsterASP.NET

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "database/**"
      - ".github/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/FactoryQuoteApi.csproj

      - name: Build Release
        run: dotnet build backend/FactoryQuoteApi.csproj -c Release --no-restore

      - name: Run Tests (if exists)
        run: |
          if ls tests/*.csproj 1> /dev/null 2>&1; then
            dotnet test --no-build -c Release
          else
            echo "No test projects found, skipping tests."
          fi

      - name: Publish Backend
        run: dotnet publish backend/FactoryQuoteApi.csproj -c Release -o ./backend/publish

      - name: Deploy to MonsterASP.NET via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: /wwwroot
        run: |
          python3 .github/deploy.py

      - name: Verify Production Health
        run: |
          echo "Waiting for app to start up..."
          sleep 6
          for i in {1..6}; do
            echo "Health check attempt $i..."
            if curl -f -s -S https://factory-quote.runasp.net/api/health; then
              echo ""
              echo "Production health check PASSED!"
              exit 0
            fi
            sleep 5
          done
          echo "Production health check failed after multiple attempts."
          exit 1
