name: Deploy Backend to MonsterASP.NET

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "database/**"
      - ".github/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/FactoryQuoteApi.csproj

      - name: Build Release
        run: dotnet build backend/FactoryQuoteApi.csproj -c Release --no-restore

      - name: Run Tests (if exists)
        run: |
          if ls tests/*.csproj 1> /dev/null 2>&1; then
            dotnet test --no-build -c Release
          else
            echo "No test projects found, skipping tests."
          fi

      - name: Publish Backend
        run: dotnet publish backend/FactoryQuoteApi.csproj -c Release -o ./backend/publish

      - name: Take App Offline
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo '<!DOCTYPE html><html><head><title>Updating Application</title></head><body><h2>Updating System... Please wait a few seconds.</h2></body></html>' > app_offline.htm
          curl -k --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/wwwroot/app_offline.htm" -T app_offline.htm
          echo "Waiting 6 seconds for IIS to release file locks..."
          sleep 6

      - name: Deploy to MonsterASP.NET via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/publish/
          server-dir: /wwwroot/
          dangerous-clean-slate: false

      - name: Bring App Online
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl -k --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/wwwroot/" -Q "-DELE app_offline.htm" || true

      - name: Verify Production Health
        run: |
          echo "Waiting for app to start up..."
          sleep 6
          for i in {1..8}; do
            echo "Health check attempt $i..."
            if curl -f -s -S https://factory-quote.runasp.net/api/health; then
              echo ""
              echo "Production health check PASSED!"
              exit 0
            fi
            sleep 5
          done
          echo "Production health check failed after multiple attempts."
          exit 1
